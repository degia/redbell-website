<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redbell Shop — Segera Hadir</title>
  <meta name="description" content="Redbell Shop by RedbellGroup: toko online resmi langsung dari pabrik Red Bell. Segera hadir." />
  <meta name="theme-color" content="#E4002B" />
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .soon{min-height:100vh;display:grid;place-items:center;position:relative;overflow:hidden;padding:40px 0;text-align:center}
    .soon__card{position:relative;background:#fff;border-radius:32px;padding:48px 36px;max-width:640px;box-shadow:0 40px 80px -30px rgba(228,0,43,.45);border:3px solid var(--ink)}
    .soon__card h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:18px 0 6px}
    .soon__card h1 small{display:block;font:600 1rem "Plus Jakarta Sans";color:var(--muted);margin-top:6px}
    .soon__card p{color:var(--ink-2);margin:14px auto 26px;max-width:480px}
    .soon__row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .soon__mk{margin-top:30px;padding-top:24px;border-top:2px dashed var(--line)}
    .soon__mk h3{font-size:1.1rem;margin-bottom:14px}
    .soon__mk .market__grid{text-align:left}
  </style>
</head>
<body>
  <section class="soon">
    <div class="hero__blobs" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span></div>
    <div class="container" style="display:grid;place-items:center">
      <div class="soon__card">
        <a href="/"><img src="/assets/img/logo.svg" alt="Red Bell" style="height:46px;margin:0 auto" /></a>
        <h1><span class="grad-text">Redbell Shop</span><small>by RedbellGroup</small></h1>
        <span class="pill">🚧 Segera Hadir</span>
        <p>Toko online resmi langsung dari pabrik Red Bell — harga terbaik, stok lengkap, dan promo eksklusif member BestieBell. Mau dikabari saat buka?</p>
        <div class="soon__row">
          <a class="btn btn--primary" data-link="whatsapp" href="#" target="_blank" rel="noopener">💬 Kabari Saya via WhatsApp</a>
          <a class="btn btn--ghost" href="/">&larr; Kembali ke Beranda</a>
        </div>
        <div class="soon__mk">
          <h3>Sementara itu, belanja di marketplace resmi:</h3>
          <div class="market__grid" id="marketGrid"></div>
        </div>
      </div>
    </div>
  </section>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
</body>
</html>
